services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: leimoz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leimoz
      POSTGRES_USER: leimoz
      POSTGRES_PASSWORD: leimozpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: leimoz-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
